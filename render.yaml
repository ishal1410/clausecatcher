# Render Blueprint for ClauseCatcher (free Docker web service).
# https://render.com/docs/blueprint-spec
#
# Secrets are NOT set here — Render env vars marked `sync: false` are left
# blank by the blueprint and must be pasted into the Render dashboard by
# whoever deploys (see docs/DEPLOY.md). Nothing secret lives in this file
# or anywhere in git.

services:
  - type: web
    name: clausecatcher
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CLAUSECATCHER_CLAIM_CHECK
        value: gemini
      - key: CLAUSECATCHER_GEMINI_MODEL
        sync: false
      # Abuse / spend guards (see docs/DEPLOY.md "Spend and abuse limits").
      - key: CLAUSECATCHER_MAX_LIVE_WS
        value: "2"
      - key: CLAUSECATCHER_BUDGET_USD
        value: "3"
      - key: CLAUSECATCHER_PAID_DISABLED
        value: "0"
      - key: CLAUSECATCHER_SESSION_CAP_S
        value: "420"
      - key: CLAUSECATCHER_MAX_CHECKS
        value: "40"
      - key: CLAUSECATCHER_MAX_GEMINI_CALLS
        value: "300"
      # Set to https://<service>.onrender.com after the first deploy.
      - key: CLAUSECATCHER_ALLOWED_ORIGINS
        sync: false
