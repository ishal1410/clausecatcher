<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClauseCatcher — dev self-check</title>
  <style>
    body { font-family: ui-monospace, Consolas, monospace; background: #0f1720; color: #e6edf3; padding: 1.5rem; }
    h1 { font-size: 1.1rem; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    p.summary { font-weight: 600; }
  </style>
</head>
<body>
  <h1>ClauseCatcher — dsp.js self-test</h1>
  <p>Unit-tests the downsampler and the Int16/base64/playback-scheduling math with no network and no live audio device. Served by FastAPI StaticFiles like the rest of /web.</p>
  <p class="summary" id="summary">Running…</p>
  <pre id="results"></pre>

  <script type="module">
    import { runAll } from "./dsp.selftest.js";

    const results = runAll();
    const pre = document.getElementById("results");
    const summary = document.getElementById("summary");

    pre.textContent = results
      .map((r) => `[${r.pass ? "PASS" : "FAIL"}] ${r.name}${r.detail ? "\n       " + r.detail : ""}`)
      .join("\n");

    const failed = results.filter((r) => !r.pass).length;
    summary.textContent = failed === 0
      ? `All ${results.length} checks passed.`
      : `${failed} of ${results.length} checks FAILED.`;
    summary.className = failed === 0 ? "pass" : "fail";
  </script>
</body>
</html>
